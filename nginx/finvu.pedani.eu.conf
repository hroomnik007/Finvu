server {
    listen 80;
    listen [::]:80;
    server_name finvu.pedani.eu;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finvu.pedani.eu;

    # ── SSL (managed by Certbot) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/finvu.pedani.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finvu.pedani.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Document root ────────────────────────────────────────────────────────
    # GOTCHA: deploy.sh (FRONTEND_DEST) and .github/workflows/deploy.yml both
    # write the build to the nested finance-tracker/finance-tracker/dist path.
    # This root MUST match that exact path — a prior mismatch here caused
    # nginx to silently serve a ~2-month-stale build (see incident 2026-07-06).
    root  /var/www/finance-tracker/finance-tracker/dist;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────
    # GOTCHA: any location block that declares its own add_header does NOT
    # inherit these — the full set must be repeated verbatim in every such
    # block below. Do not remove the duplicates.
    # CSP notes:
    #  - script-src has no 'unsafe-inline': the theme bootstrap is the external
    #    /theme-init.js; accounts.google.com is for Google Sign-In (GSI)
    #  - style-src 'unsafe-inline' is still needed for React style={} props
    #  - style-src/font-src cover the Google Fonts @import in index.css
    #  - connect-src covers the API origin and GSI
    add_header X-Frame-Options           "DENY"                    always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection          "0"                       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # -- Block common vulnerability-scanner probes -----------------------------
    # Silently drop the connection (444) for CMS/secret/webshell scan paths.
    # Keeps them off the backend and out of the error log. Complements the
    # fail2ban nginx-scanners jail.
    location ~* (?:^|/)(?:wp-admin|wp-login\.php|wp-json|xmlrpc\.php|\.env|\.git|\.aws)(?:/|\.|$) {
        return 444;
    }

    # ── TWA: Digital Asset Links — no cache, no SPA redirect ────────────────
    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options           "DENY"                    always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection          "0"                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # ── Cache: immutable static assets (1 year) ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options           "DENY"                    always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection          "0"                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        access_log off;
    }

    # ── Cache: service worker — never cache ───────────────────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options           "DENY"                    always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection          "0"                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # ── Cache: index.html — no-store (PWA must always get fresh shell) ────────
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options           "DENY"                    always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection          "0"                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # ── SPA fallback — all routes serve index.html ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires off;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options           "DENY"                    always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection          "0"                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }
}
