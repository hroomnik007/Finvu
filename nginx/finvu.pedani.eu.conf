server {
    listen 80;
    listen [::]:80;
    server_name finvu.pedani.eu;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finvu.pedani.eu;

    # ── SSL (managed by Certbot) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/finvu.pedani.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finvu.pedani.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Document root ────────────────────────────────────────────────────────
    # GOTCHA: deploy.sh (FRONTEND_DEST) and .github/workflows/deploy.yml both
    # write the build to the nested finance-tracker/finance-tracker/dist path.
    # This root MUST match that exact path — a prior mismatch here caused
    # nginx to silently serve a ~2-month-stale build (see incident 2026-07-06).
    root  /var/www/finance-tracker/finance-tracker/dist;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────
    # The full set lives in nginx/snippets/finvu-security-headers.conf (copy it to
    # /etc/nginx/snippets/). GOTCHA: a location block that declares its own
    # add_header does NOT inherit the server-level ones, so every such block
    # below includes the snippet again. Do not remove those includes.
    include snippets/finvu-security-headers.conf;

    # -- Block common vulnerability-scanner probes -----------------------------
    # Silently drop the connection (444) for CMS/secret/webshell scan paths.
    # Keeps them off the backend and out of the error log. Complements the
    # fail2ban nginx-scanners jail.
    location ~* (?:^|/)(?:wp-admin|wp-login\.php|wp-json|xmlrpc\.php|\.env|\.git|\.aws)(?:/|\.|$) {
        return 444;
    }

    # ── TWA: Digital Asset Links — no cache, no SPA redirect ────────────────
    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-cache" always;
        include snippets/finvu-security-headers.conf;
    }

    # ── Cache: immutable static assets (1 year) ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/finvu-security-headers.conf;
        access_log off;
    }

    # ── Cache: service worker — never cache ───────────────────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include snippets/finvu-security-headers.conf;
    }

    # ── Cache: index.html — no-store (PWA must always get fresh shell) ────────
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store";
        include snippets/finvu-security-headers.conf;
    }

    # ── SPA fallback — all routes serve index.html ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires off;
        add_header Cache-Control "no-store";
        include snippets/finvu-security-headers.conf;
    }
}
