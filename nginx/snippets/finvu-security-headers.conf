# Security headers for finvu.pedani.eu. Included at server level and again in
# every location that sets its own add_header (those don't inherit). Deploy to
# /etc/nginx/snippets/finvu-security-headers.conf.
#
# CSP notes:
#  - script-src has no 'unsafe-inline': the theme bootstrap is the external
#    /theme-init.js; accounts.google.com is for Google Sign-In (GSI)
#  - style-src 'unsafe-inline' is still needed for React style={} props
#  - fonts are self-hosted (src/fonts.css), so no Google Fonts hosts
#  - connect-src covers the API origin and GSI
add_header X-Frame-Options           "DENY"                    always;
add_header X-Content-Type-Options    "nosniff"                 always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection          "0"                       always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; img-src 'self' https: data:; connect-src 'self' https://api.pedani.eu https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
