name: Deploy to Hetzner
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'finance-tracker/**'
      - 'backend/**'
      - 'landing/**'
concurrency:
  group: hetzner-deploy
  cancel-in-progress: false
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_frontend: ${{ steps.filter.outputs.frontend }}
      changed_backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'finance-tracker/**'
              - 'landing/**'
            backend:
              - 'backend/**'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend — install
        working-directory: finance-tracker
        run: npm ci --legacy-peer-deps
      - name: Frontend — ESLint
        working-directory: finance-tracker
        run: npx eslint . --max-warnings 20
      - name: Frontend — typecheck
        working-directory: finance-tracker
        run: npx tsc -b --noEmit
      - name: Frontend — tests
        working-directory: finance-tracker
        run: npm test
      - name: Backend — install
        working-directory: backend
        run: npm ci
      - name: Backend — typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend — tests
        working-directory: backend
        run: npm test
  deploy-frontend:
    needs: [detect-changes, lint]
    if: needs.lint.result == 'success' && needs.detect-changes.outputs.changed_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/finance-tracker-repo
            git fetch origin main
            git reset --hard origin/main
            cd /var/www/finance-tracker-repo/finance-tracker
            rm -rf ~/.npm/_cacache || true
            rm -rf node_modules && npm cache clean --force
            npm ci --legacy-peer-deps
            export PATH="$PATH:$(pwd)/node_modules/.bin"
            git log --pretty=format:'{"hash":"%h","date":"%ad","message":"%s"}' --date=short -50 2>/dev/null | grep -v '^$' | awk 'NR==1{print "["} NR>1{print ","} {print} END{print "]"}' > public/changelog.json || echo "[]" > public/changelog.json
            VITE_API_URL=https://api.pedani.eu VITE_BASE_URL=/ VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }} VITE_BUILD_DATE=$(date +'%Y.%m.%d') npm run build
            sudo mkdir -p /var/www/finance-tracker/finance-tracker/dist
            sudo chown -R deploy:deploy /var/www/finance-tracker/finance-tracker/dist
            cp -r dist/* /var/www/finance-tracker/finance-tracker/dist/
            cp /var/www/finance-tracker-repo/landing/index.html /var/www/landing/index.html 2>/dev/null || true
            sudo systemctl reload nginx
  deploy-backend:
    needs: [detect-changes, lint, deploy-frontend]
    # NOTE: an `if:` that doesn't call always()/success()/failure() gets an
    # implicit `&& success()` appended by GitHub Actions, which requires
    # ALL `needs` jobs (including deploy-frontend) to have literally
    # succeeded — but deploy-frontend is *expected* to be `skipped` on a
    # backend-only push. Without always() here, this job silently skips
    # on every backend-only commit despite the explicit skipped-check below.
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      needs.detect-changes.outputs.changed_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/finance-tracker-repo
            git fetch origin main
            git reset --hard origin/main
            cd /var/www/finance-tracker-repo/backend
            rm -rf ~/.npm/_cacache || true
            rm -rf node_modules && npm cache clean --force
            npm ci --prefer-offline
            # Add DATABASE_URL to GitHub repo Settings → Secrets and variables → Actions
            DATABASE_URL=${{ secrets.DATABASE_URL }} npm run db:migrate
            cd /var/www/finance-tracker-repo
            docker compose build backend
            docker compose down --remove-orphans || true
            docker rm -f finance-tracker-repo-backend-1 2>/dev/null || true
            docker compose up -d --no-deps backend
