# Version updates (security updates are switched on in the repo settings).
# Minor and patch bumps are grouped into one PR per directory and week; majors
# come one by one so each can be read and tested on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /finance-tracker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
