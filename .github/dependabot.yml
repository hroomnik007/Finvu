# Version updates (security updates are switched on in the repo settings).
# Minor and patch bumps are grouped into one PR per directory and week; majors
# come one by one so each can be read and tested on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /finance-tracker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (ESLint fails to start);
      # drop this once it does
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # 7.1 turns on the stricter refs / set-state-in-effect / purity rules (44 errors);
      # drop this together with the PR that fixes them
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1.0"]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
