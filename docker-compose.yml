services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # The backend drains requests on SIGTERM (src/lib/shutdown.ts, 20 s cap);
    # give it that long before Docker falls back to SIGKILL (default 10 s).
    stop_grace_period: 30s
    env_file:
      - ./backend/.env
    ports:
      # Bind to loopback only — the public entrypoint is nginx (api.pedani.eu)
      - "127.0.0.1:3001:3001"
    volumes:
      # Persist uploaded avatars across container rebuilds
      - uploads_data:/app/uploads
    networks:
      - finance-tracker_default
    external_links:
      - finance-tracker-postgres-1:postgres
    # The entrypoint starts as root only to chown /app/uploads (CHOWN) and then drops to
    # the node user through su-exec (SETGID for setgroups/setgid, SETUID for setuid);
    # the app itself runs with no effective capabilities. Each of the three was
    # tested: without it the container does not start.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  finance-tracker_default:
    external: true

volumes:
  uploads_data:
