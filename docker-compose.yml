services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # The backend drains requests on SIGTERM (src/lib/shutdown.ts, 20 s cap);
    # give it that long before Docker falls back to SIGKILL (default 10 s).
    stop_grace_period: 30s
    env_file:
      - ./backend/.env
    ports:
      # Bind to loopback only — the public entrypoint is nginx (api.pedani.eu)
      - "127.0.0.1:3001:3001"
    volumes:
      # Persist uploaded avatars across container rebuilds
      - uploads_data:/app/uploads
    networks:
      - finance-tracker_default
    external_links:
      - finance-tracker-postgres-1:postgres

networks:
  finance-tracker_default:
    external: true

volumes:
  uploads_data:
